x-backend: &backend
  image: amazonwatch-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: amazonwatch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amazonwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amazonwatch}
      POSTGRES_DB: ${POSTGRES_DB:-amazonwatch}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *backend
    restart: "no"
    command: alembic upgrade head
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-amazonwatch}:${POSTGRES_PASSWORD:-amazonwatch}@postgis:5432/${POSTGRES_DB:-amazonwatch}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja .env.example)}

  api:
    <<: *backend
    container_name: amazonwatch_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-amazonwatch}:${POSTGRES_PASSWORD:-amazonwatch}@postgis:5432/${POSTGRES_DB:-amazonwatch}
      MEDIA_DIR: /data/media
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost"]'
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja .env.example)}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - media_data:/data/media

  worker:
    <<: *backend
    container_name: amazonwatch_worker
    restart: unless-stopped
    command: python -m app.worker
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-amazonwatch}:${POSTGRES_PASSWORD:-amazonwatch}@postgis:5432/${POSTGRES_DB:-amazonwatch}
      MEDIA_DIR: /data/media
      FRAME_RETENTION_HOURS: ${FRAME_RETENTION_HOURS:-48}
      NETCDF_RETENTION_HOURS: ${NETCDF_RETENTION_HOURS:-48}
      NETCDF_DIR: /data/netcdf
      IGRA_ENABLED: ${IGRA_ENABLED:-true}
      IGRA_REFRESH_MINUTES: ${IGRA_REFRESH_MINUTES:-60}
      PIPELINE_INTERVAL_MINUTES: "5"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja .env.example)}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    volumes:
      - netcdf_data:/data/netcdf
      - igra_data:/data/igra
      - media_data:/data/media


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - media_data:/data/media:ro
    container_name: amazonwatch_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  postgis_data:
  media_data:
  igra_data:
  netcdf_data:
